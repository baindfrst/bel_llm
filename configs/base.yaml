# Pretrain с нуля. Продолжение — configs/base_r4.yaml.
name: mid_C_100m_32k
seed: 1337
out_dir: runs

data:
  tokenizer: tokenizers/bel_bpe_32k.model
  train_bin: data/tokens/bpe32k/train.bin
  val_bin: data/tokens/bpe32k/validation.bin
  test_bin: data/tokens/bpe32k/test.bin

model:
  vocab_size: 32000
  max_seq_len: 512
  d_model: 768
  n_layers: 12
  n_heads: 8
  n_kv_heads: 4
  intermediate_size: 2560
  rope_theta: 10000.0
  norm_eps: 1.0e-5
  tie_embeddings: true
  init_std: 0.02
  dropout: 0.0
  attn_impl: auto

train:
  micro_batch_size: 16
  grad_accum_steps: 16
  max_steps: 200000
  warmup_steps: 600
  lr: 1.0e-3
  min_lr_ratio: 0.1
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  dtype: auto
  compile: true
  gradient_checkpointing: true
  log_interval: 20
  eval_interval: 500
  eval_tokens: 500000
  eval_batch_size: 8
  save_interval: 1000
  final_eval_tokens: null
